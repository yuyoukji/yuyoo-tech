<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>联系客服</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Microsoft YaHei",-apple-system,sans-serif; background:#f5f6f8; min-height:100vh; }
  .nav { position:sticky; top:0; z-index:100; height:50px; background:#fff; display:flex; align-items:center; padding:0 14px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
  .nav-back { width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#333; cursor:pointer; border-radius:50%; }
  .nav-back:active { background:#f0f0f0; }
  .nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; color:#1a1a1a; }
  .nav-right { width:36px; }
  .hero { background:linear-gradient(160deg,#1a7fd4,#3aa0ee); padding:36px 20px 70px; text-align:center; color:#fff; }
  .hero-icon { width:70px; height:70px; margin:0 auto 16px; border-radius:20px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:34px; }
  .hero-title { font-size:20px; font-weight:700; }
  .hero-sub { font-size:13px; opacity:0.85; margin-top:8px; }
  .card-wrap { padding:0 16px; margin-top:-44px; }
  .card { background:#fff; border-radius:16px; padding:8px 0; box-shadow:0 4px 16px rgba(0,0,0,0.06); }
  .cell { display:flex; align-items:center; padding:18px 20px; }
  .cell:not(:last-child) { border-bottom:1px solid #f5f6f8; }
  .cell-icon { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-right:14px; }
  .ci-blue { background:#e8f0fb; }
  .ci-green { background:#e8f7ee; }
  .ci-orange { background:#fff3e8; }
  .cell-body { flex:1; }
  .cell-label { font-size:12px; color:#8a919c; }
  .cell-value { font-size:17px; font-weight:700; color:#1a1a1a; margin-top:4px; letter-spacing:0.5px; }
  .cell-desc { font-size:12px; color:#b0b8c4; margin-top:4px; }
  .cell-action { font-size:13px; color:#1a7fd4; font-weight:600; cursor:pointer; padding:8px 14px; border:1px solid #d0e2f5; border-radius:18px; }
  .cell-action:active { background:#f0f6fd; }
  .tips { margin:20px 16px; padding:14px 16px; background:#fff8f2; border-radius:10px; font-size:12px; color:#8a919c; line-height:1.7; }
  .tips strong { color:#ff7a18; }
</style>
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/ui.js"></script>
</head>
<body>
  <div class="nav">
    <div class="nav-back" onclick="history.back()">‹</div>
    <div class="nav-title">联系客服</div>
    <div class="nav-right"></div>
  </div>

  <div class="hero">
    <div class="hero-icon">🎧</div>
    <div class="hero-title">誉友科技客户服务</div>
    <div class="hero-sub">专业服务团队，随时为您排忧解难</div>
  </div>

  <div class="card-wrap">
    <div class="card">
      <div class="cell">
        <div class="cell-icon ci-blue">📞</div>
        <div class="cell-body">
          <div class="cell-label">客服热线</div>
          <div class="cell-value">199-1703-3375</div>
          <div class="cell-desc">点击右侧按钮一键拨打</div>
        </div>
        <div class="cell-action" onclick="callPhone()">拨打</div>
      </div>
      <div class="cell">
        <div class="cell-icon ci-green">🕐</div>
        <div class="cell-body">
          <div class="cell-label">工作时间</div>
          <div class="cell-value">周一至周五 9:00 - 18:00</div>
          <div class="cell-desc">节假日除外，紧急情况请留言</div>
        </div>
      </div>
      <div class="cell">
        <div class="cell-icon ci-orange">📧</div>
        <div class="cell-body">
          <div class="cell-label">意见反馈</div>
          <div class="cell-value">在线提交反馈</div>
          <div class="cell-desc">产品建议与问题反馈，我们会尽快回复</div>
        </div>
        <div class="cell-action" onclick="goPage('418813')">去反馈</div>
      </div>
    </div>
  </div>

  <div class="tips">
    <strong>温馨提示：</strong>非工作时间留言，我们将在下一个工作日优先处理。如需技术支持或项目咨询，请直接拨打客服热线，我们将为您提供一对一专业服务。
  </div>

<script>
  function callPhone() {
    window.location.href = 'tel:19917033375';
  }
  function goPage(id) { window.location.href = id + '.html'; }
</script>
</body>
</html>
