<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>验证码登录</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"Microsoft YaHei",-apple-system,sans-serif; background:linear-gradient(160deg,#fff 0%,#fff8f2 60%,#ffefe2 100%); min-height:100vh; padding-bottom:40px; }
  .nav { position:sticky; top:0; z-index:100; height:50px; display:flex; align-items:center; padding:0 14px; }
  .nav-back { width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:20px; color:#333; cursor:pointer; border-radius:50%; }
  .nav-back:active { background:rgba(0,0,0,0.05); }
  .nav-title { flex:1; text-align:center; font-size:16px; font-weight:600; color:#1a1a1a; }
  .nav-right { width:36px; font-size:13px; color:#ff7a18; text-align:right; cursor:pointer; }
  .head { text-align:center; margin-top:24px; }
  .head-icon { width:64px; height:64px; margin:0 auto; border-radius:16px; background:linear-gradient(135deg,#ff7a18,#ff9436); display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 8px 18px rgba(255,122,24,0.28); }
  .head-title { margin-top:16px; font-size:20px; font-weight:700; color:#1a1a1a; }
  .head-sub { margin-top:6px; font-size:13px; color:#8a919c; }
  .form { width:86%; max-width:340px; margin:30px auto 0; }
  .field { display:flex; align-items:center; background:#fff; border:1.5px solid #eceff2; border-radius:12px; padding:0 14px; height:50px; margin-bottom:14px; transition:border .15s; }
  .field:focus-within { border-color:#ff7a18; }
  .field .icon { font-size:16px; color:#b0b8c4; margin-right:10px; }
  .field input { flex:1; border:none; outline:none; font-size:15px; color:#1a1a1a; background:transparent; height:100%; font-family:inherit; }
  .field input::placeholder { color:#c0c6cd; }
  .code-btn { flex-shrink:0; font-size:13px; color:#ff7a18; cursor:pointer; padding:6px 0 6px 12px; border-left:1px solid #f0f0f0; }
  .code-btn.disabled { color:#c0c6cd; cursor:default; }
  .link-row { display:flex; justify-content:space-between; margin-top:4px; padding:0 2px; }
  .link-row a { font-size:13px; color:#8a919c; text-decoration:none; }
  .link-row a:hover { color:#ff7a18; }
  .btn-login { width:100%; margin-top:24px; padding:14px; border:none; border-radius:24px; background:linear-gradient(90deg,#ff7a18,#ff9436); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  .btn-login:active { opacity:.85; }
  .divider { display:flex; align-items:center; margin:28px 0 18px; color:#c0c6cd; font-size:12px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:#eceff2; }
  .divider span { padding:0 12px; }
  .quick { display:flex; justify-content:center; gap:28px; }
  .quick-item { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
  .quick-icon { width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,0.08); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .quick-item span { font-size:12px; color:#8a919c; }
  .agreement { margin-top:28px; display:flex; justify-content:center; align-items:flex-start; font-size:12px; color:#8a919c; line-height:1.6; }
  .agree-check { width:15px; height:15px; border:1.5px solid #c8cdd2; border-radius:50%; margin-right:6px; flex-shrink:0; margin-top:2px; cursor:pointer; color:#fff; display:flex; align-items:center; justify-content:center; font-size:9px; }
  .agree-check.checked { background:#ff7a18; border-color:#ff7a18; }
  .agree-check.checked::after { content:'✓'; }
  .agreement a { color:#ff7a18; text-decoration:none; }
  .toast { position:fixed; top:45%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,0.75); color:#fff; padding:12px 22px; border-radius:8px; font-size:14px; z-index:999; display:none; }
</style>
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/ui.js"></script>
</head>
<body>
  <div class="nav">
    <div class="nav-back" onclick="history.back()">‹</div>
    <div class="nav-title">验证码登录</div>
    <div class="nav-right" onclick="goRegister()">注册</div>
  </div>

  <div class="head">
    <div class="head-icon">📱</div>
    <div class="head-title">手机号登录</div>
    <div class="head-sub">未注册的手机号验证后将自动创建账号</div>
  </div>

  <div class="form">
    <div class="field">
      <div class="icon">📞</div>
      <input id="phone" type="tel" maxlength="11" placeholder="请输入手机号" oninput="this.value=this.value.replace(/\D/g,'')">
    </div>
    <div class="field">
      <div class="icon">🔒</div>
      <input id="code" type="tel" maxlength="6" placeholder="请输入验证码" oninput="this.value=this.value.replace(/\D/g,'')">
      <div class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</div>
    </div>

    <div class="link-row">
      <a onclick="goRegister()">注册账号</a>
      <a onclick="showToast('请联系客服找回密码')">忘记密码</a>
    </div>

    <button class="btn-login" onclick="doLogin()">登录</button>

    <div class="divider"><span>其他登录方式</span></div>
    <div class="quick">
      <div class="quick-item" onclick="wechatLogin()">
        <div class="quick-icon" style="color:#1aad19">💬</div>
        <span>微信登录</span>
      </div>
      <div class="quick-item" onclick="goPage('426384')">
        <div class="quick-icon" style="color:#ff7a18">⚡</div>
        <span>一键登录</span>
      </div>
    </div>

    <div class="agreement">
      <div class="agree-check" id="agreeCk" onclick="toggleAgree()"></div>
      <div>已阅读并同意 <a onclick="goPage('418829')">《用户注册协议》</a> 与 <a onclick="goPage('418828')">《隐私政策》</a></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var agreed = false;
  var countdown = 0;
  var timer = null;

  function toggleAgree() {
    agreed = !agreed;
    document.getElementById('agreeCk').classList.toggle('checked', agreed);
  }
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(function(){ t.style.display = 'none'; }, 1600);
  }
  function goPage(id) { window.location.href = id + '.html'; }
  function goRegister() { showToast('验证码登录即自动注册'); }
  function wechatLogin() { goPage('426384'); }

  function validPhone(p) { return /^1[3-9]\d{9}$/.test(p); }

  function sendCode() {
    if (countdown > 0) return;
    var phone = document.getElementById('phone').value;
    if (!validPhone(phone)) { showToast('请输入正确的手机号'); return; }
    countdown = 60;
    var btn = document.getElementById('codeBtn');
    btn.classList.add('disabled');
    btn.textContent = countdown + 's 后重发';
    timer = setInterval(function() {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        btn.classList.remove('disabled');
        btn.textContent = '获取验证码';
      } else {
        btn.textContent = countdown + 's 后重发';
      }
    }, 1000);
    showToast('验证码已发送（演示：任意6位）');
  }

  function doLogin() {
    if (!agreed) { showToast('请先阅读并同意协议'); return; }
    var phone = document.getElementById('phone').value;
    var code = document.getElementById('code').value;
    if (!validPhone(phone)) { showToast('请输入正确的手机号'); return; }
    if (code.length !== 6) { showToast('请输入6位验证码'); return; }
    localStorage.setItem('yuyoo_user', JSON.stringify({ name:'誉友用户', phone:phone, avatar:'', loginAt:Date.now() }));
    showToast('登录成功');
    setTimeout(function(){ window.location.href = '418848.html'; }, 1200);
  }
</script>
</body>
</html>
