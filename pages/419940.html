<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
<title>产品分类</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif; background:#f5f6f8; min-height:100vh; display:flex; max-width:480px; margin:0 auto; }
  /* 左侧分类导航 */
  .side { width:96px; flex-shrink:0; background:#f7f8fa; height:100vh; height:100dvh; overflow-y:auto; border-right:1px solid #edeff2; }
  .cat-item { padding:21px 6px; font-size:14px; color:#4a525c; text-align:center; cursor:pointer; border-left:3px solid transparent; transition:all .2s; line-height:1.4; position:relative; }
  .cat-item.active { background:#fff; color:#ff7a18; font-weight:600; border-left-color:#ff7a18; }
  .cat-item.active::after { content:''; position:absolute; right:10px; top:50%; width:4px; height:4px; border-radius:50%; background:#ff7a18; transform:translateY(-50%); }
  .cat-item:not(.active):active { background:#eef0f3; color:#1a1a1a; }
  /* 右侧产品区 */
  .main { flex:1; padding:14px; overflow-y:auto; height:100vh; height:100dvh; scroll-behavior:smooth; }
  .main::-webkit-scrollbar { width:0; }
  .main-title { position:sticky; top:0; z-index:5; margin:-14px -14px 12px; padding:14px 16px 12px; font-size:15px; font-weight:600; color:#1a1a1a; background:rgba(245,246,248,0.92); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid rgba(0,0,0,0.04); }
  /* 菜单开关按钮（默认隐藏，手机端显示） */
  .menu-btn { display:none; width:34px; height:34px; border-radius:10px; background:#ff7a18; color:#fff; font-size:17px; font-weight:700; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; transition:transform .25s, opacity .25s; }
  .menu-btn:active { transform:scale(0.92); }
  /* 遮罩（默认隐藏，手机端随菜单显示） */
  .backdrop { display:none; position:fixed; inset:0; z-index:150; background:rgba(0,0,0,0.45); opacity:0; pointer-events:none; transition:opacity .28s ease; }
  .backdrop.show { opacity:1; pointer-events:auto; }
  .prod-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .prod-card { background:#fff; border-radius:14px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.05); cursor:pointer; transition:transform .25s, box-shadow .25s; animation:fadeUp .3s ease; }
  .prod-card:active { transform:scale(0.97); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .prod-img { width:100%; height:110px; object-fit:cover; display:block; background:#eef0f3; }
  .prod-body { padding:10px 12px 12px; }
  .prod-name { font-size:14px; font-weight:600; color:#1a1a1a; line-height:1.4; }
  .prod-slogan { font-size:11px; color:#ff7a18; margin-top:5px; }
  .empty { grid-column:1/-1; text-align:center; padding:70px 0; color:#8a93a0; font-size:13px; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  /* 优势亮点（同步自首页，深色背景图+亮点卡片） */
  .adv-section { margin:14px 0 0; }
  .adv-bg { position:relative; border-radius:14px; overflow:hidden; background-image:url('../assets/img/products/advantage.jpg'); background-size:cover; background-position:center; }
  .adv-bg::before { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(8,16,32,0.72) 0%, rgba(8,16,32,0.62) 55%, rgba(8,16,32,0.78) 100%); }
  .adv-inner { position:relative; z-index:1; padding:26px 18px 18px; color:#fff; }
  .adv-title { font-size:18px; font-weight:700; text-align:center; text-shadow:0 2px 6px rgba(0,0,0,0.5); }
  .adv-sub { font-size:12px; color:rgba(255,255,255,0.82); text-align:center; margin-top:6px; }
  .adv-list { display:flex; flex-direction:column; gap:12px; margin-top:18px; }
  .adv-item { display:flex; align-items:center; background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.16); border-radius:12px; padding:12px 14px; backdrop-filter:blur(4px); }
  .adv-item .ico { width:36px; height:36px; flex-shrink:0; border-radius:10px; background:linear-gradient(135deg,#ff7a18,#ff9436); display:flex; align-items:center; justify-content:center; font-size:18px; box-shadow:0 2px 8px rgba(255,122,24,0.4); }
  .adv-item .body { margin-left:12px; flex:1; min-width:0; }
  .adv-item .t { font-size:14px; font-weight:600; color:#fff; }
  .adv-item .d { font-size:11px; color:rgba(255,255,255,0.78); margin-top:2px; line-height:1.5; }
  /* 手机端：侧边分类栏改为可开/关的滑出菜单，避免遮挡产品内容 */
  @media (max-width:767px) {
    .menu-btn { display:flex; }
    .backdrop { display:block; }
    .side {
      position:fixed;
      top:0;
      left:0;
      bottom:0;
      z-index:200;
      width:96px;
      transform:translateX(-100%);
      transition:transform .28s ease;
      box-shadow:none;
    }
    .side.open { transform:translateX(0); box-shadow:4px 0 20px rgba(0,0,0,0.18); }
    .main-title { display:flex; align-items:center; gap:10px; padding:12px 14px; }
    .main-title > span:last-child { flex:1; }
  }
  @media (max-width:360px) { .side { width:84px; } .prod-grid { gap:10px; } .prod-img { height:96px; } }
  @media (min-width:481px) { body { box-shadow:0 0 40px rgba(0,0,0,0.06); } }
</style>
<link rel="stylesheet" href="../assets/css/app.css">
<script src="../assets/js/ui.js"></script>
<script src="../assets/js/tabbar.js"></script>
</head>
<body>
  <div class="backdrop" id="backdrop"></div>
  <div class="side" id="side"></div>
  <div class="main">
    <div class="main-title"><span class="menu-btn" id="menuBtn">☰</span><span id="mainTitle">全部产品</span></div>
    <div class="prod-grid" id="grid"></div>
    <!-- 优势亮点 -->
    <div class="adv-section">
      <div class="adv-bg">
        <div class="adv-inner">
          <div class="adv-title">誉友优势 值得信赖</div>
          <div class="adv-sub">数字化交付全链路 · 一站式技术服务</div>
          <div class="adv-list">
            <div class="adv-item"><div class="ico">💻</div><div class="body"><div class="t">多端定制开发</div><div class="d">PC 网页 / APP / 小程序多端覆盖，一套业务逻辑多端触达</div></div></div>
            <div class="adv-item"><div class="ico">⚡</div><div class="body"><div class="t">高效交付周期</div><div class="d">标准模板快速上线，定制需求高效排期，按期交付有保障</div></div></div>
            <div class="adv-item"><div class="ico">🛡️</div><div class="body"><div class="t">数据安全合规</div><div class="d">数据加密存储、等保合规，全流程权限管控保障信息安全</div></div></div>
            <div class="adv-item"><div class="ico">🤝</div><div class="body"><div class="t">贴心售后服务</div><div class="d">7x24 技术支持，专属客户经理跟进，响应及时省心无忧</div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/data.js"></script>
  <script src="../assets/js/products.js"></script>
<script>
  var curCat = 'all';

  // 手机端菜单开/关
  var sideEl = document.getElementById('side');
  var backdropEl = document.getElementById('backdrop');
  var menuBtnEl = document.getElementById('menuBtn');
  function closeMenu() {
    sideEl.classList.remove('open');
    backdropEl.classList.remove('show');
  }
  menuBtnEl.addEventListener('click', function() {
    sideEl.classList.toggle('open');
    backdropEl.classList.toggle('show');
  });
  backdropEl.addEventListener('click', closeMenu);

  function renderSide() {
    var html = '<div class="cat-item active" data-cat="all">全部</div>';
    YUYOO_CATEGORIES.forEach(function(c) {
      html += '<div class="cat-item" data-cat="' + c.id + '">' + c.name + '</div>';
    });
    document.getElementById('side').innerHTML = html;
    document.getElementById('side').addEventListener('click', function(e) {
      var item = e.target.closest('.cat-item');
      if (!item) return;
      document.querySelectorAll('.cat-item').forEach(function(el){ el.classList.remove('active'); });
      item.classList.add('active');
      curCat = item.getAttribute('data-cat');
      renderMain();
      // 手机端选择分类后收起菜单
      if (window.innerWidth <= 767) closeMenu();
    });
  }

  function renderMain() {
    var title = '全部产品';
    if (curCat !== 'all') {
      var c = YUYOO_CATEGORIES.find(function(x){ return x.id === curCat; });
      title = c ? c.name : '产品';
    }
    document.getElementById('mainTitle').textContent = title;

    var list = curCat === 'all'
      ? YUYOO_PRODUCTS
      : YUYOO_PRODUCTS.filter(function(p){ return p.category === curCat; });

    var grid = document.getElementById('grid');
    if (!list.length) {
      grid.innerHTML = '<div class="empty">该分类暂无产品</div>';
      return;
    }
    var html = '';
    list.forEach(function(p) {
      html += '<div class="prod-card" onclick="openDetail(\'' + p.id + '\')">' +
        '<img class="prod-img" loading="lazy" src="' + p.image + '" onerror="this.onerror=null;this.src=yuyooProductImage(p.name)">' +
        '<div class="prod-body">' +
          '<div class="prod-name">' + p.name + '</div>' +
          '<div class="prod-slogan">' + p.slogan + '</div>' +
        '</div></div>';
    });
    grid.innerHTML = html;
  }

  function openDetail(id) {
    window.location.href = '418913.html?id=' + id;
  }

  renderSide();
  renderMain();
</script>
</body>
</html>
