# 誉友科技 H5 站点 · Nginx 配置模板
# 部署位置（ECS 上）: /etc/nginx/conf.d/yuyoo-tech.conf
# 站点目录: /var/www/yuyoo-tech
# 域名占位: 将 <DOMAIN> 替换为已备案域名（由 install-server.sh 自动替换）

# HTTP -> HTTPS 跳转
server {
    listen 80;
    server_name <DOMAIN>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name <DOMAIN>;

    # 证书（生产请使用备案域名的正式证书，替换自签名证书）
    ssl_certificate     /etc/nginx/ssl/<DOMAIN>.pem;
    ssl_certificate_key /etc/nginx/ssl/<DOMAIN>.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/yuyoo-tech;
    index index.html;

    # HTML 不强缓存，更新即时生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # 图片/字体/JS/CSS 长缓存 30 天
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    server_tokens off;

    # 日志
    access_log /var/log/nginx/yuyoo-tech.access.log;
    error_log  /var/log/nginx/yuyoo-tech.error.log;

    # gzip 压缩
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    location / {
        try_files $uri $uri/ =404;
    }
}
